<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royal Match Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Video -->
    <video id="main-video" playsinline autoplay>
      <source src="assets/intro_videoroyalmatch_2.mp4" type="video/mp4" />
      Tu navegador no soporta video.
    </video>

    <!-- Imagen + Cartas (oculto hasta que termina el video) -->
    <div class="image-section" id="image-section">
      <div class="slider">
        <div class="card"><img src="assets/card_1.png" alt="Carta 1"></div>
        <div class="card"><img src="assets/card_2.png" alt="Carta 2"></div>
        <div class="card"><img src="assets/card_3.png" alt="Carta 3"></div>
      </div>
    <!-- Play Now -->
    <div class="boton-play" id="boton-play">
      <div class="boton">
        <div class="boton"></div><img src="assets/BUTTON.png" alt="boton play"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
