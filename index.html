<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royal Match Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Video -->
    <video id="main-video" playsinline autoplay muted>
      <source src="assets/intro_videoroyalmatch_2.mp4" type="video/mp4" />
      Your browser does not support video.
    </video>

    <!-- Image + Cards (hidden until video ends) -->
    <div class="image-section" id="image-section">
      <!-- Logo with bounce effect -->
      <div class="logo-container">
        <img src="assets/RM_Logo.png" alt="Royal Match Logo" class="logo-bounce">
      </div>

      <div class="slider">
        <div class="card"><img src="assets/card_1.png" alt="Card 1"></div>
        <div class="card"><img src="assets/card_2.png" alt="Card 2"></div>
        <div class="card"><img src="assets/card_3.png" alt="Card 3"></div>
      </div>
    <!-- Play Now Button -->
    <div class="boton-play" id="boton-play">
      <div class="boton"><img src="assets/BUTTON.png" alt="play button"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
